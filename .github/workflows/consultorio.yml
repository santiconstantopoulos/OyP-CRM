name: Verificar y empaquetar el CRM

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Probar el circuito de pedidos
        run: npm test

      - name: Compilar la aplicación
        run: npm run build

      - name: Empaquetar el proyecto Node.js
        run: git archive --format=zip --prefix=oyp-consultorio/ --output="$RUNNER_TEMP/oyp-consultorio.zip" HEAD

      - name: Guardar el ZIP descargable
        uses: actions/upload-artifact@v4
        with:
          name: oyp-consultorio-node
          path: ${{ runner.temp }}/oyp-consultorio.zip
          if-no-files-found: error
